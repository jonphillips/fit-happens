name: FitHappens
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
packages:
  FitHappensCore:
    path: FitHappensCore
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
targets:
  FitHappens:
    type: application
    platform: iOS
    sources:
      - path: FitHappens
    entitlements:
      path: FitHappens/FitHappens.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jonphillips.fithappens
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: FitHappens/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        CFBundleDisplayName: Fit Happens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: FitHappensCore
        product: FitHappensCore
      - package: swift-dependencies
        product: Dependencies
