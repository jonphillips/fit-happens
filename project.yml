name: FitHappens
options:
  bundleIdPrefix: com.jonphillips
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7MQEE539G9
packages:
  FitHappensCore:
    path: FitHappensCore
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.0.0
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.3.0
  ChatAccessKit:
    path: ../jon-platform/packages/ChatAccessKit
  LLMHandoffKit:
    path: ../jon-platform/packages/LLMHandoffKit
  FitHappensInboxKit:
    path: FitHappensInboxKit
targets:
  FitHappens:
    type: application
    platform: iOS
    sources:
      - path: FitHappens
    entitlements:
      path: FitHappens/FitHappens.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jonphillips.fithappens
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.jonphillips.fithappens
        com.apple.developer.healthkit: true
    info:
      path: FitHappens/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        CFBundleDisplayName: Fit Happens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Fit Happens reads your workouts, walking distance, and body weight to show recent activity and link Watch workouts to your program.
    dependencies:
      - package: FitHappensCore
        product: FitHappensCore
      - package: swift-dependencies
        product: Dependencies
      - package: swift-sharing
        product: Sharing
      - package: ChatAccessKit
        product: ChatAccessKit
      - package: LLMHandoffKit
        product: LLMHandoffKit
      - package: FitHappensInboxKit
        product: FitHappensInboxKit
schemes:
  FitHappens:
    build:
      targets:
        FitHappens: all
    run:
      config: Debug
